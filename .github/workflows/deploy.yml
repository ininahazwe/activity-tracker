name: 🚀 Deploy Activity Tracker Pro

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ========== STEP 1: CHECKOUT ==========
      - name: Checkout code
        uses: actions/checkout@v5

      # ========== STEP 2: DEPLOY TO PROD ==========
      - name: Deploy to cPanel
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 600s
          command_timeout: 600s
          script: |
            set -e

            echo "=== 🚀 Starting deployment: Activity Tracker Pro ==="

            # ========== DÉFINITIONS ==========
            REPO_PATH="/home/${{ secrets.SSH_USER }}/repositories/activity-tracker"
            PROD_ROOT="/home/${{ secrets.SSH_USER }}/public_html/tracker.mfwa.org"
            PROD_BACKEND="$PROD_ROOT/api"
            BACKUP_PATH="/home/${{ secrets.SSH_USER }}/backups/tracker-$(date +%Y%m%d-%H%M%S)"
            
            # ========== BACKUP CURRENT STATE ==========
            echo "📦 Creating backup..."
            mkdir -p "$(dirname "$BACKUP_PATH")"
            cp -r "$PROD_ROOT" "$BACKUP_PATH" 2>/dev/null || true
            echo "✅ Backup created at $BACKUP_PATH"

            # ========== GIT PULL (HARD RESET) ==========
            echo "📥 Pulling latest code..."
            cd "$REPO_PATH"
            
            echo "  Fetching from origin..."
            git fetch origin main
            
            echo "  Hard reset to origin/main..."
            git reset --hard origin/main
            
            COMMIT_HASH=$(git rev-parse --short HEAD)
            echo "✅ Git reset complete (commit: $COMMIT_HASH)"

            # ========== VERIFY SOURCE CODE ==========
            echo "🔍 Verifying source files exist..."
            
            if [ ! -f "$REPO_PATH/server/src/services/emailService.ts" ]; then
              echo "  ❌ emailService.ts not found!"
              exit 1
            fi
            
            if [ ! -f "$REPO_PATH/server/src/routes/chat.ts" ]; then
              echo "  ❌ chat.ts not found!"
              exit 1
            fi
            
            if [ ! -f "$REPO_PATH/server/src/services/ai-providers.ts" ]; then
              echo "  ❌ ai-providers.ts not found!"
              exit 1
            fi
            
            echo "✅ All required source files exist"

            # ========== CLEAN BUILD CACHES ==========
            echo "🧹 Cleaning build caches..."
            
            echo "  Cleaning frontend cache..."
            rm -rf "$REPO_PATH/client/node_modules/.cache" 2>/dev/null || true
            rm -rf "$REPO_PATH/client/dist" 2>/dev/null || true
            
            echo "  Cleaning backend cache..."
            rm -rf "$REPO_PATH/server/node_modules/.cache" 2>/dev/null || true
            rm -rf "$REPO_PATH/server/dist" 2>/dev/null || true
            
            echo "✅ Caches cleaned"

            # ========== FRONTEND BUILD ==========
            echo "🎨 Building frontend..."
            cd "$REPO_PATH/client"
            npm ci --quiet
            npm run build --quiet
            
            if [ ! -d "$REPO_PATH/client/dist" ]; then
              echo "  ❌ Frontend dist build failed!"
              exit 1
            fi
            echo "✅ Frontend built"

            # ========== BACKEND BUILD ==========
            echo "📦 Building backend..."
            cd "$REPO_PATH/server"
            npm ci --quiet
            npm run build --quiet
            
            if [ ! -d "$REPO_PATH/server/dist" ]; then
              echo "  ❌ Backend dist build failed!"
              exit 1
            fi
            echo "✅ Backend compiled"

            # ========== VERIFY COMPILED CODE ==========
            echo "🔍 Verifying compiled backend..."
            
            if [ ! -f "$REPO_PATH/server/dist/routes/chat.js" ]; then
              echo "  ❌ ERROR: chat.js not found in dist!"
              echo "     chat.ts was not compiled properly"
              exit 1
            fi
            
            if [ ! -f "$REPO_PATH/server/dist/services/ai-providers.js" ]; then
              echo "  ❌ ERROR: ai-providers.js not found in dist!"
              echo "     ai-providers.ts was not compiled properly"
              exit 1
            fi
            
            if grep -q "Resend" "$REPO_PATH/server/dist/services/emailService.js" 2>/dev/null; then
              echo "  ❌ ERROR: Old Resend code still in compiled emailService.js!"
              exit 1
            fi
            
            if grep -q "nodemailer\|gmail" "$REPO_PATH/server/dist/services/emailService.js" 2>/dev/null; then
              echo "  ✅ Gmail/nodemailer found in compiled code"
            fi
            
            echo "✅ Compiled code verified"

            # ========== STOP PM2 ==========
            echo "🛑 Stopping PM2 process..."
            if pm2 list | grep -q "tracker-api"; then
              pm2 stop tracker-api --silent || true
              sleep 2
              pm2 delete tracker-api --silent || true
            fi
            echo "✅ PM2 stopped"

            # ========== CLEAN PROD DIRECTORY ==========
            echo "🧹 Cleaning production directory..."
            rm -rf "$PROD_BACKEND/dist"
            rm -rf "$PROD_BACKEND/node_modules"
            rm -rf "$PROD_BACKEND/logs"
            mkdir -p "$PROD_BACKEND/logs"
            # Clean frontend files but keep the directory structure
            rm -rf "$PROD_ROOT/assets"
            rm -f "$PROD_ROOT/index.html"
            rm -f "$PROD_ROOT"/*.js
            rm -f "$PROD_ROOT"/*.css
            rm -f "$PROD_ROOT"/*.map
            echo "✅ Production cleaned"

            # ========== PRESERVE .env ==========
            echo "🔒 Preserving .env..."
            ENV_FILE="$PROD_ROOT/.env"
            ENV_BACKUP="/tmp/tracker-env-backup-$(date +%s).env"
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$ENV_BACKUP"
              echo "  ✅ .env backed up to $ENV_BACKUP"
            else
              echo "  ⚠️  No existing .env found at $ENV_FILE"
            fi

            # ========== DEPLOY BACKEND ==========
            echo "📤 Deploying backend files..."
            cp -r "$REPO_PATH/server/dist" "$PROD_BACKEND/dist"
            cp "$REPO_PATH/server/package.json" "$PROD_BACKEND/package.json"
            cp "$REPO_PATH/server/package-lock.json" "$PROD_BACKEND/package-lock.json"
            echo "✅ Backend deployed"

            # ========== RESTORE .env ==========
            echo "🔒 Restoring .env..."
            if [ -f "$ENV_BACKUP" ]; then
              cp "$ENV_BACKUP" "$PROD_ROOT/.env"
              rm "$ENV_BACKUP"
              echo "  ✅ .env restored to $PROD_ROOT/.env"
            else
              echo "  ⚠️  Warning: .env not available, checking if it exists in production..."
              if [ ! -f "$PROD_ROOT/.env" ]; then
                echo "  ❌ ERROR: .env missing and no backup!"
                exit 1
              fi
            fi

            # ========== DEPLOY FRONTEND ==========
            echo "📤 Deploying frontend files..."
            cp -r "$REPO_PATH/client/dist"/* "$PROD_ROOT/"
            echo "✅ Frontend deployed to root"

            # ========== INSTALL DEPENDENCIES ==========
            echo "📦 Installing dependencies..."
            cd "$PROD_BACKEND"
            npm install --omit=dev --quiet
            echo "✅ Dependencies installed"

            # ========== PM2 START ==========
            echo "🚀 Starting PM2 process..."
            pm2 start "$PROD_BACKEND/dist/index.js" \
              --name "tracker-api" \
              --watch false \
              --max-memory-restart "500M" \
              --error "$PROD_BACKEND/logs/error.log" \
              --output "$PROD_BACKEND/logs/out.log" \
              --silent
            
            sleep 3
            pm2 save --silent
            echo "✅ PM2 process started"

            # ========== VALIDATION ==========
            echo "🔍 Validating deployment..."
            
            ERRORS=0
            
            # Check files
            if [ -d "$PROD_BACKEND/dist" ]; then
              echo "  ✅ Backend dist exists"
            else
              echo "  ❌ Backend dist missing"
              ERRORS=$((ERRORS + 1))
            fi
            
            if [ -f "$PROD_ROOT/index.html" ]; then
              echo "  ✅ Frontend files deployed (index.html exists)"
            else
              echo "  ❌ Frontend files missing (index.html not found)"
              ERRORS=$((ERRORS + 1))
            fi
            
            if [ -f "$PROD_ROOT/.env" ]; then
              echo "  ✅ .env exists at $PROD_ROOT/.env"
            else
              echo "  ❌ .env missing"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Check critical compiled files
            if [ -f "$PROD_BACKEND/dist/routes/chat.js" ]; then
              echo "  ✅ chat.js compiled and deployed"
            else
              echo "  ❌ chat.js missing from dist"
              ERRORS=$((ERRORS + 1))
            fi
            
            if [ -f "$PROD_BACKEND/dist/services/ai-providers.js" ]; then
              echo "  ✅ ai-providers.js compiled and deployed"
            else
              echo "  ❌ ai-providers.js missing from dist"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Check PM2 status
            sleep 2
            if pm2 list | grep -q "tracker-api.*online"; then
              echo "  ✅ PM2 process online"
            else
              echo "  ❌ PM2 process not online"
              pm2 logs tracker-api --nostream | tail -20
              ERRORS=$((ERRORS + 1))
            fi
            
            # Check logs for critical errors
            if [ -f "$PROD_BACKEND/logs/error.log" ]; then
              if grep -q "ECONNREFUSED\|Cannot find module\|SyntaxError" "$PROD_BACKEND/logs/error.log"; then
                echo "  ❌ Critical errors in logs"
                tail -10 "$PROD_BACKEND/logs/error.log"
                ERRORS=$((ERRORS + 1))
              else
                echo "  ✅ No critical errors in logs"
              fi
            else
              echo "  ✅ No error logs yet (normal)"
            fi
            
            # Exit with status
            if [ $ERRORS -gt 0 ]; then
              echo "❌ Validation failed with $ERRORS errors"
              exit 1
            else
              echo "✅ All validations passed"
            fi

            echo "=== ✨ Deployment complete (commit: $COMMIT_HASH) ==="

      # ========== STEP 3: TEST HEALTH ENDPOINT ==========
      - name: Test health endpoint
        id: health_test
        run: |
          echo "Testing health endpoint..."
          for i in {1..10}; do
            RESPONSE=$(curl -s -w "\n%{http_code}" https://tracker.mfwa.org/api/health)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)
          
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health endpoint OK (attempt $i)"
              echo "$BODY"
              exit 0
            else
              echo "⏳ Attempt $i/10 failed (HTTP $HTTP_CODE), retrying in 2s..."
              sleep 2
            fi
          done
          
          echo "❌ Health endpoint failed after 10 attempts"
          exit 1

      # ========== STEP 4: SUCCESS NOTIFICATION ==========
      - name: 🎉 Success notification
        if: success()
        run: |
          echo "=== ✨ DEPLOYMENT SUCCESSFUL ==="
          echo "App: https://tracker.mfwa.org"
          echo "API: https://tracker.mfwa.org/api/health"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      # ========== STEP 5: FAILURE NOTIFICATION + ROLLBACK ==========
      - name: ⚠️ Failure - Rollback
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "❌ Deployment failed, attempting rollback..."
            
            PROD_ROOT="/home/${{ secrets.SSH_USER }}/public_html/tracker.mfwa.org"
            BACKUP_DIR="/home/${{ secrets.SSH_USER }}/backups"
            
            # Find the most recent backup
            LATEST_BACKUP=$(ls -td "$BACKUP_DIR"/tracker-* 2>/dev/null | head -1)
            
            if [ -n "$LATEST_BACKUP" ] && [ -d "$LATEST_BACKUP" ]; then
              echo "🔄 Restoring from backup: $LATEST_BACKUP"
            
              # Stop PM2
              if pm2 list | grep -q "tracker-api"; then
                pm2 stop tracker-api --silent || true
                sleep 1
                pm2 delete tracker-api --silent || true
              fi
            
              # Restore files
              rm -rf "$PROD_ROOT"
              cp -r "$LATEST_BACKUP" "$PROD_ROOT"
            
              # Restart PM2
              cd "$PROD_ROOT/api"
              pm2 start dist/index.js --name tracker-api --silent
              sleep 2
              pm2 save --silent
            
              echo "✅ Rollback completed"
            else
              echo "⚠️ No backup found for rollback"
            fi