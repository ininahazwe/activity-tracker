name: Deploy to Production

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "=== 🚀 Starting deployment: Activity Tracker Pro ==="
            
            # ========== DÉFINITIONS ==========
            REPO_PATH="/home/${{ secrets.SSH_USER }}/repositories/activity-tracker-pro"
            PROD_PATH="/home/${{ secrets.SSH_USER }}/public_html/tracker.mfwa.org"
            
            # ========== GIT PULL (avec logs détaillés) ==========
            echo "📥 Pulling latest code from main branch..."
            cd "$REPO_PATH"
            
            # Affiche l'état actuel
            echo "  Current commit: $(git rev-parse HEAD)"
            echo "  Pulling..."
            
            git fetch origin main
            git reset --hard origin/main
            
            echo "  New commit: $(git rev-parse HEAD)"
            echo "✅ Git pull successful"
            
            # ========== VÉRIFICATION DU CODE SOURCE ==========
            echo "🔍 Verifying source files..."
            if grep -q "nodemailer" "$REPO_PATH/server/src/services/emailService.ts"; then
              echo "  ✅ Gmail SMTP (nodemailer) detected in emailService.ts"
            elif grep -q "Resend" "$REPO_PATH/server/src/services/emailService.ts"; then
              echo "  ⚠️  WARNING: Old Resend code still in emailService.ts"
            fi
            
            # ========== FRONTEND BUILD ==========
            echo "🎨 Building frontend..."
            cd "$REPO_PATH/client"
            npm ci --quiet
            npm run build --quiet
            echo "✅ Frontend built"
            
            # ========== BACKEND BUILD ==========
            echo "📦 Building backend..."
            cd "$REPO_PATH/server"
            npm ci --quiet
            npm run build --quiet
            echo "✅ Backend compiled"
            
            # Vérifie que le build a utilisé le bon code
            if grep -q "nodemailer" "$REPO_PATH/server/dist/services/emailService.js"; then
              echo "  ✅ Gmail SMTP compiled correctly"
            elif grep -q "Resend" "$REPO_PATH/server/dist/services/emailService.js"; then
              echo "  ⚠️  WARNING: Old Resend code in compiled dist!"
            fi
            
            # ========== CLEANUP PROD (PHASE 1: REMOVE OLD) ==========
            echo "🧹 Cleaning production directory..."
            
            # Stop PM2 process if exists
            if pm2 list | grep -q "tracker-api"; then
              echo "  🛑 Stopping tracker-api..."
              pm2 stop tracker-api --silent || true
            fi
            
            # Remove old process from PM2
            if pm2 list | grep -q "tracker-api"; then
              echo "  🗑️ Removing tracker-api from PM2..."
              pm2 delete tracker-api --silent || true
            fi
            
            # Clean directories
            echo "  📁 Removing old dist, public, node_modules..."
            rm -rf "$PROD_PATH/dist"
            rm -rf "$PROD_PATH/public"
            rm -rf "$PROD_PATH/node_modules"
            rm -rf "$PROD_PATH/logs"
            
            echo "✅ Production cleaned"
            
            # ========== DEPLOY BACKEND ==========
            echo "📤 Deploying backend files..."
            mkdir -p "$PROD_PATH"
            mkdir -p "$PROD_PATH/logs"
            
            cp -r "$REPO_PATH/server/dist" "$PROD_PATH/dist"
            cp "$REPO_PATH/server/package.json" "$PROD_PATH/package.json"
            cp "$REPO_PATH/server/package-lock.json" "$PROD_PATH/package-lock.json"
            
            # NOTE: .env is PRESERVED from production (not overwritten)
            # Production secrets are managed separately:
            # GMAIL_USER=yves.cri@gmail.com
            # GMAIL_APP_PASSWORD=...
            echo "ℹ️  .env preserved from production (not overwritten)"
            
            echo "✅ Backend deployed"
            
            # ========== DEPLOY FRONTEND ==========
            echo "📤 Deploying frontend files..."
            mkdir -p "$PROD_PATH/public"
            cp -r "$REPO_PATH/client/dist"/* "$PROD_PATH/public/"
            echo "✅ Frontend deployed to /public"
            
            # ========== INSTALL DEPENDENCIES ==========
            echo "📦 Installing dependencies..."
            cd "$PROD_PATH"
            npm install --omit=dev --quiet
            echo "✅ Dependencies installed"
            
            # ========== PM2 START ==========
            echo "🚀 Starting PM2 process (tracker-api)..."
            pm2 start "$PROD_PATH/dist/index.js" \
              --name "tracker-api" \
              --env "$PROD_PATH/.env" \
              --watch false \
              --max-memory-restart "500M" \
              --error "$PROD_PATH/logs/error.log" \
              --output "$PROD_PATH/logs/out.log" \
              --silent
            
            sleep 2
            pm2 save --silent
            echo "✅ PM2 process started and saved"
            
            # ========== VALIDATION ==========
            echo "🔍 Validating deployment..."
            
            # Check directories
            [ -d "$PROD_PATH/dist" ] && echo "  ✅ Backend dist exists" || echo "  ❌ Backend dist missing"
            [ -d "$PROD_PATH/public" ] && echo "  ✅ Frontend build exists" || echo "  ❌ Frontend build missing"
            [ -f "$PROD_PATH/package.json" ] && echo "  ✅ package.json exists" || echo "  ❌ package.json missing"
            [ -f "$PROD_PATH/.env" ] && echo "  ✅ .env exists" || echo "  ❌ .env missing"
            
            # Check PM2 status
            echo "📊 PM2 Status:"
            pm2 list | grep "tracker-api" || echo "  ⚠️ tracker-api not found"
            
            # Check logs for email service
            echo "📧 Checking email service configuration..."
            sleep 3
            pm2 logs tracker-api --nostream | grep -i "email service" | head -1 || echo "  (checking logs...)"
            
            echo "=== ✨ Deployment complete ==="
